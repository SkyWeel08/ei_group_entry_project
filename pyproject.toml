[project]
name = "eilink-pipeline"
version = "0.1.0"
description = "Production-ready PDF extraction, NLP analysis, and NDS matching pipeline for eiLink RA DS 2026."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "rank-bm25>=0.2",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
eilink-pipeline = "eilink_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["eilink_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
